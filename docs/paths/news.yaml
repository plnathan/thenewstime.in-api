paths:

  ############################################################
  # GET NEWS LIST
  ############################################################

  /news:

    get:

      tags:
        - News

      summary: Get News List

      description: Returns a paginated list of news.

      parameters:

        - in: query
          name: page
          schema:
            type: integer
            default: 1

        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20

        - in: query
          name: search
          schema:
            type: string

        - in: query
          name: status
          schema:
            type: string

        - in: query
          name: categoryId
          schema:
            type: integer

        - in: query
          name: scope
          schema:
            type: string

        - in: query
          name: stateId
          schema:
            type: integer

        - in: query
          name: districtId
          schema:
            type: integer

        - in: query
          name: sortBy
          schema:
            type: string

        - in: query
          name: sortOrder
          schema:
            type: string
            enum:
              - ASC
              - DESC

      responses:

        "200":
          description: News list retrieved successfully.

        "400":
          description: Validation failed.

        "500":
          description: Internal server error.

  ############################################################
  # CREATE NEWS
  ############################################################

    post:

      tags:
        - News

      summary: Create News

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/CreateNewsRequest"

      responses:

        "201":
          description: News created successfully.

        "400":
          description: Validation failed.

        "500":
          description: Internal server error.

  ############################################################
  # GET NEWS BY ID
  ############################################################

  /news/{id}:

    get:

      tags:
        - News

      summary: Get News By Id

      parameters:

        - in: path

          name: id

          required: true

          schema:
            type: integer

      responses:

        "200":
          description: News retrieved successfully.

        "404":
          description: News not found.

        "500":
          description: Internal server error.

  ############################################################
  # UPDATE NEWS
  ############################################################

    put:

      tags:
        - News

      summary: Update News

      parameters:

        - in: path

          name: id

          required: true

          schema:
            type: integer

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/UpdateNewsRequest"

      responses:

        "200":
          description: News updated successfully.

        "400":
          description: Validation failed.

        "404":
          description: News not found.

        "500":
          description: Internal server error.

  ############################################################
  # DELETE NEWS
  ############################################################

    delete:

      tags:
        - News

      summary: Delete News

      parameters:

        - in: path

          name: id

          required: true

          schema:
            type: integer

      responses:

        "200":
          description: News deleted successfully.

        "404":
          description: News not found.

        "500":
          description: Internal server error.

  ############################################################
  # CHANGE STATUS
  ############################################################

  /news/{id}/status:

    patch:

      tags:
        - News

      summary: Change News Status

      parameters:

        - in: path

          name: id

          required: true

          schema:
            type: integer

      responses:

        "200":
          description: Status updated successfully.

  ############################################################
  # APPROVE NEWS
  ############################################################

  /news/{id}/approve:

    patch:

      tags:
        - News

      summary: Approve News

      parameters:

        - in: path

          name: id

          required: true

          schema:
            type: integer

      responses:

        "200":
          description: News approved successfully.

  ############################################################
  # PUBLISH NEWS
  ############################################################

  /news/{id}/publish:

    patch:

      tags:
        - News

      summary: Publish News

      parameters:

        - in: path

          name: id

          required: true

          schema:
            type: integer

      responses:

        "200":
          description: News published successfully.

  ############################################################
  # ARCHIVE NEWS
  ############################################################

  /news/{id}/archive:

    patch:

      tags:
        - News

      summary: Archive News

      parameters:

        - in: path

          name: id

          required: true

          schema:
            type: integer

      responses:

        "200":
          description: News archived successfully.